# Postil configuration. No secrets here: API keys are read from the env vars
# named by `api_key_env` (see .env.example).

# SQLite file, relative to the repo root.
database_path: data/postil.db

# Model used for new conversations (an `id` from `models` below).
default_model: qwen3-local

# Model used to summarize side threads into merge notes; null = the thread's own model.
summarizer_model: null

# Warn when an assembled context exceeds this many tokens, for models that
# don't set `context_window` below.
token_budget: 8000

models:
  - id: qwen3-local
    label: Qwen3 1.7B (Ollama)
    provider: openai_compat
    model: qwen3:1.7b
    base_url: http://localhost:11434/v1
    api_key_env: null
    # Must match the context Ollama actually allocates (OLLAMA_CONTEXT_LENGTH in
    # the ollama service; check with `ollama ps`). Ollama's default is 4096 and it
    # silently drops the start of longer prompts.
    context_window: 16384
    # Extra request params passed through to the provider. Disabling thinking
    # keeps small local models responsive on CPU.
    params:
      reasoning_effort: none

  # Hosted models. Each is listed in the picker but disabled until its
  # `api_key_env` variable is set (in .env for `make dev`).
  - id: claude-opus
    label: Claude Opus 5.5
    provider: anthropic
    model: claude-opus-5-5
    api_key_env: ANTHROPIC_API_KEY
    context_window: 1000000
    # Anthropic params: max_tokens (default 64000) and betas are handled by the
    # adapter; anything else is sent as-is. `fallbacks: default` lets the API
    # retry a declined request on a suitable fallback model instead of stopping.
    params:
      betas: [server-side-fallback-2026-07-01]
      fallbacks: default

  # OpenAI goes through the OpenAI-compatible adapter (base_url null = api.openai.com).
  # OpenAI caches long prompt prefixes automatically; no params needed for that.
  - id: openai
    label: GPT-5.5 (OpenAI)
    provider: openai_compat
    model: gpt-5.5
    base_url: null
    api_key_env: OPENAI_API_KEY
    context_window: 400000  # budget for the meter's warning; adjust if OpenAI lists another limit
